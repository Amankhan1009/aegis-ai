[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter/line-length above

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F403"]  # star-import registers models on Base.metadata

[tool.pytest.ini_options]
testpaths = ["tests"]