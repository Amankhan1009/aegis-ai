name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

  docker-build:
    name: Validate Docker images
    runs-on: ubuntu-24.04
    needs: lint-and-test

  dockerhub-push:
    name: Build and push Docker Hub images
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      API_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/aegis-ai-api
      DASHBOARD_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/aegis-ai-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push Streamlit dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./streamlit/Dockerfile
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
